
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="230" viewBox="0 0 1000 230">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080B18"/>
      <stop offset="55%" stop-color="#15102D"/>
      <stop offset="100%" stop-color="#071522"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7047FF"/>
      <stop offset="50%" stop-color="#B16CFF"/>
      <stop offset="100%" stop-color="#36D9FF"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#5270B0" stroke-opacity=".16"/>
    </pattern>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1000" height="230" rx="14" fill="url(#bg)"/>
  <rect width="1000" height="230" rx="14" fill="url(#grid)"/>

  <g fill="none" stroke="url(#neon)" stroke-width="1.5">
    <path d="M0 44H115L143 72H235"/>
    <path d="M0 56H76L98 78V103H177"/>
    <path d="M1000 42H895L869 68H790"/>
    <path d="M1000 58H936L914 80V104H831"/>
    <path d="M0 183H105L128 160H210"/>
    <path d="M1000 183H895L872 160H790"/>
  </g>

  <g fill="#49DFFF" filter="url(#glow)">
    <circle cx="115" cy="44" r="3"/>
    <circle cx="235" cy="72" r="3"/>
    <circle cx="895" cy="42" r="3"/>
    <circle cx="790" cy="68" r="3"/>
  </g>

  <g stroke="#6D55FF" fill="none" opacity=".65">
    <circle cx="500" cy="30" r="13"/>
    <circle cx="500" cy="30" r="23" stroke-dasharray="3 6"/>
    <path d="M500 7V0M500 53V65M477 30H465M523 30H535"/>
  </g>

  <text x="500" y="94" text-anchor="middle"
    font-family="monospace" font-size="13" letter-spacing="5"
    fill="#65DFFF">AI • MACHINE LEARNING • GENERATIVE AI</text>

  <text x="500" y="143" text-anchor="middle"
    font-family="monospace" font-size="35" font-weight="700"
    fill="#B99AFF" filter="url(#glow)">AARYAV CHAUDHARY</text>

  <path d="M240 160H760" stroke="url(#neon)" stroke-width="2"/>
  <circle cx="240" cy="160" r="3" fill="#6DE7FF"/>
  <circle cx="760" cy="160" r="3" fill="#B99AFF"/>

  <text x="500" y="190" text-anchor="middle"
    font-family="monospace" font-size="14" letter-spacing="2"
